services:
  mem0:
    build:
      context: ./docker/mem0
    ports:
      - "${MEM0_PORT:-8888}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - MEM0_EMBEDDING_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_EMBEDDING_URL=${OPENROUTER_EMBEDDING_URL:-https://openrouter.ai/api/v1/embeddings}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${AWS_REGION:-us-west-2}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-west-2}
      - SAGEMAKER_ENDPOINT_NAME=${SAGEMAKER_ENDPOINT_NAME:-}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - COLLECTION_NAME=${COLLECTION_NAME:-memories}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - EMBEDDER_PROVIDER=${EMBEDDER_PROVIDER:-openrouter}
      - EMBEDDER_MODEL=${EMBEDDER_MODEL:-openai/text-embedding-3-small}
      - EMBEDDING_DIMS=${EMBEDDING_DIMS:-1536}
      - MEMORY_GATE_ENABLED=${MEMORY_GATE_ENABLED:-true}
      - MEMORY_GATE_FAIL_OPEN=${MEMORY_GATE_FAIL_OPEN:-true}
      - MEMORY_GATE_MODEL=${MEMORY_GATE_MODEL:-deepseek-chat}
      - MEMORY_GATE_BASE_URL=${MEMORY_GATE_BASE_URL:-${OPENAI_BASE_URL:-https://api.deepseek.com}}
      - MEMORY_GATE_API_KEY=${MEMORY_GATE_API_KEY:-${OPENAI_API_KEY}}
      - MEMORY_GATE_PROMPT_FORMAT=${MEMORY_GATE_PROMPT_FORMAT:-json}
    volumes:
      - mem0_history:/app/history
      # Custom config for advanced setups (Azure, Ollama, SageMaker, etc.)
      # Uncomment and point to your config file:
      # - ./mem0-config.yaml:/app/config.yaml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6333 && echo ok'"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  qdrant_data:
  mem0_history:
